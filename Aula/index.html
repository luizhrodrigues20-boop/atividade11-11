<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Comunitária</title>
    <link rel="stylesheet" href="style.css">
    <script src="resources/iscript/script.js" defer ></script>
</head>

<body>
    <header>
        <h1> Gestão Comunitária</h1>
        <p>Organizando e cuidando da nossa comunidade</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Cadastro de Moradores</h2>

            <form id="formMorador">
                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>

                <label>Telefone</label>
                <input type="text" id="telefone" placeholder="Digite seu telefone" required>

                <label>Endereço</label>
                <input type="text" id="endereco" placeholder="Digite seu endereço" required>

                <button type="submit">Cadastrar Morador</button>
            </form>
        </section>

        <section class="card">
            <h2>Moradores cadastrados</h2>
            <ul id="listaMoradores"></ul>
        </section>

    </main>

    <footer>
        <p>Gestão Comunitária © 2026</p>
    </footer>

<ul id="listaMoradores"></ul>
</body>

</html>
